<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Dôkazy radosti – kartičky</title>
<style>
  @page { size: A4; margin: 10mm; }
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; color: #000; background: #fff; margin: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; }
  .k { border: 1px dashed #000; height: 68mm; padding: 5mm; font-size: 10pt; line-height: 1.35; }
  .k h2 { font-size: 13pt; margin: 0 0 2mm; letter-spacing: 1px; }
  .k .d { font-size: 9pt; margin-top: 2mm; }
  .glove { float: right; font-size: 22pt; line-height: 1; }
</style>
</head>
<body>
<!-- 8 kartičiek na A4. Rozdať 22. 2. -->
<div class="grid" id="g"></div>
<script>
const k = `<div class="k"><span class="glove">🧤</span><h2>TAJNÁ MISIA ZVEDA</h2>
<b>Dôkazy radosti · do 1. 3.</b><br>
Bí-Pi nechal pod vrcholom rukavičku ako dôkaz, že tam naozaj bol. Ty prines <b>tri dôkazy radosti</b>: tri veci, ktoré ti robia radosť. Môže to byť vytlačená fotka, pohľadnica, lístok, kresba alebo malá vec.
<div class="d">• Nič, čo by ti bolo ľúto stratiť. Bude to visieť v klubovni až do tábora.<br>
• Ku každému dôkazu jednu vetu: <b>kde a kedy</b>.<br>
• Meno naň nepíš, ostatní budú hádať, čí je.</div></div>`;
document.getElementById('g').innerHTML = k.repeat(8);
</script>
</body>
</html>
